version: '3.8'

services:
  dashboard:
    build: .
    container_name: stripe_support_dashboard
    ports:
      - "8501:8501"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      - HOST=0.0.0.0
      - PORT=8501
    volumes:
      - .:/app
    restart: unless-stopped
